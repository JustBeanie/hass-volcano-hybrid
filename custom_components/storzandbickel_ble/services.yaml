set_temperature:
  fields:
    device_id:
      selector:
        device:
          integration: storzandbickel_ble
    temperature:
      required: true
      selector:
        number:
          min: 40
          max: 230
          step: 1
          unit_of_measurement: "°C"
    wait_until_reached:
      default: false
      selector:
        boolean:
    timeout:
      default: 600
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s

connect:
  fields:
    device_id:
      selector:
        device:
          integration: storzandbickel_ble
    wait:
      default: true
      selector:
        boolean:
    timeout:
      default: 60
      selector:
        number:
          min: 1
          max: 900
          unit_of_measurement: s

disconnect:
  fields:
    device_id:
      selector:
        device:
          integration: storzandbickel_ble
