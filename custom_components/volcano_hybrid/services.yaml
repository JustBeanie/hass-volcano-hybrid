fan_timer:
  target:
    device:
      integration: volcano_hybrid
    entity:
      integration: volcano_hybrid
  fields:
    duration:
      required: true
      example: 60
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: seconds
          mode: box
    turn_off_heat:
      required: false
      default: false
      selector:
        boolean:
    turn_off_screen:
      required: false
      default: false
      selector:
        boolean:

screen_animation:
  target:
    device:
      integration: volcano_hybrid
    entity:
      integration: volcano_hybrid
  fields:
    animation_type:
      required: true
      example: breathing
      default: none
      selector:
        select:
          translation_key: animation_type
          options:
            - none
            - blinking
            - breathing
            - ascending
            - descending
