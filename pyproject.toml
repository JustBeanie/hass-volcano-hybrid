[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

# Home Assistant's own strict-typing settings. The core repo lists strictly
# typed integrations in a .strict-typing file; a custom integration has no
# equivalent, so this config plus the CI job is the stand-in.
[tool.mypy]
python_version = "3.13"
files = ["custom_components/volcano_hybrid"]
strict = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
extra_checks = false
local_partial_types = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ASYNC", # async correctness
    "B",     # bugbear
    "C4",    # comprehensions
    "D",     # docstrings
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # import sorting
    "N",     # naming
    "PGH",   # blanket noqa / type ignore
    "RUF",
    "SIM",
    "T20",   # no print
    "TRY",   # exception anti-patterns
    "UP",    # pyupgrade
    "W",
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "TRY003", # long messages outside the exception class are fine here
    "RUF012", # _attr_* class attributes are Home Assistant's documented style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "SLF001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
