blueprint:
  name: "Storz & Bickel: fill a bag"
  description: >-
    Heats a Volcano Hybrid to a temperature, waits until it reports it has got
    there, runs the air for long enough to fill one bag, then optionally turns
    the heat off again.

    If the temperature is not reached in time, or the connection drops while
    waiting, the heat and air are switched off and the script stops with an
    error instead of carrying on.
  domain: script
  author: JustBeanie
  source_url: https://github.com/JustBeanie/hass-volcano-hybrid/blob/master/blueprints/script/storzandbickel_ble/fill_bag.yaml
  homeassistant:
    min_version: 2026.11.0
  input:
    volcano:
      name: Volcano
      description: The Volcano Hybrid's climate entity.
      selector:
        entity:
          filter:
            - integration: storzandbickel_ble
              domain: climate
    temperature:
      name: Temperature
      description: >-
        The target, in the temperature unit Home Assistant is set to. The
        Volcano accepts 40 to 230 °C (104 to 446 °F).
      default: 185
      selector:
        number:
          min: 40
          max: 446
          step: 1
          mode: box
    fill_seconds:
      name: Fill time
      description: How long the air runs. A standard bag takes about 40 seconds.
      default: 40
      selector:
        number:
          min: 5
          max: 180
          unit_of_measurement: s
    settle_seconds:
      name: Settle time
      description: >-
        How long to hold at temperature before the air starts, so the chamber
        is heated through.
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: s
    heat_up_minutes:
      name: Heat-up limit
      description: Give up if the temperature is not reached within this long.
      default: 15
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
    heat_off_after:
      name: Turn the heat off afterward
      default: true
      selector:
        boolean:

mode: single

variables:
  volcano: !input volcano
  heat_off_after: !input heat_off_after

sequence:
  - action: climate.set_temperature
    target:
      entity_id: "{{ volcano }}"
    data:
      temperature: !input temperature
  - action: climate.set_hvac_mode
    target:
      entity_id: "{{ volcano }}"
    data:
      hvac_mode: heat

  # The climate entity reports "idle" once the Volcano itself says it has
  # reached the target. The temperature is checked as well, because that
  # signal can still be set from an earlier, lower target. Also ends on a
  # dropped connection or the heater being switched off by hand, so neither
  # is waited out to the full limit.
  - wait_template: >-
      {{ states(volcano) != 'heat'
         or (state_attr(volcano, 'hvac_action') == 'idle'
             and (state_attr(volcano, 'current_temperature') | float(0))
                 >= (state_attr(volcano, 'temperature') | float(999)) - 2) }}
    timeout:
      minutes: !input heat_up_minutes
    continue_on_timeout: true
  - if:
      - condition: template
        value_template: >-
          {{ not wait.completed or states(volcano) != 'heat' }}
    then:
      - action: climate.set_fan_mode
        continue_on_error: true
        target:
          entity_id: "{{ volcano }}"
        data:
          fan_mode: "off"
      - action: climate.set_hvac_mode
        continue_on_error: true
        target:
          entity_id: "{{ volcano }}"
        data:
          hvac_mode: "off"
      - stop: The Volcano did not reach its temperature, so no bag was filled.
        error: true

  - delay:
      seconds: !input settle_seconds
  - action: climate.set_fan_mode
    target:
      entity_id: "{{ volcano }}"
    data:
      fan_mode: "on"
  - delay:
      seconds: !input fill_seconds
  - action: climate.set_fan_mode
    target:
      entity_id: "{{ volcano }}"
    data:
      fan_mode: "off"

  - if:
      - condition: template
        value_template: "{{ heat_off_after }}"
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ volcano }}"
        data:
          hvac_mode: "off"
