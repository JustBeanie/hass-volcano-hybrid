name: Feature request
description: Suggest something the integration could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The automation, dashboard or situation this would help with.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - Volcano Hybrid
        - Crafty / Crafty+
        - Venty
        - Veazy
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead
