name: Lint and test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check . --output-format=github
      - name: Format
        run: ruff format --check .

  mypy:
    name: Mypy (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt mypy
      - name: Type check
        run: mypy

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover needs the base branch to diff against.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      # Every line and every branch of the integration is covered. The report
      # is printed per module, so a gap is easy to find.
      - name: Run tests
        run: |
          python -m pytest tests/ \
            --cov=custom_components.storzandbickel_ble \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100
      # Lists exactly which changed lines a pull request leaves uncovered.
      # On a push to master there is no diff, so this passes trivially.
      - name: Report coverage of changed lines
        env:
          # Passed through the environment, never interpolated into the script.
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=100

  # The dashboard card's logic. Plain modules run by Node's own test runner:
  # nothing to install and nothing to build.
  frontend:
    name: Dashboard card
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          for file in custom_components/storzandbickel_ble/frontend/*.js; do
            node --check "$file"
          done
      - name: Run tests
        run: node --test "tests/frontend/*.test.mjs"

  # An early warning, not a gate. requirements_test.txt pins the Home
  # Assistant the suite is held to; this runs the same tests against the
  # newest one published, betas included, so an API that is about to be
  # removed shows up here a month before it reaches a release.
  test-prerelease:
    name: Pytest (newest Home Assistant, betas included)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install --upgrade --pre "pytest-homeassistant[bluetooth]"
      - name: Show the Home Assistant under test
        run: pip show homeassistant | grep -i '^version'
      - name: Run tests
        run: python -m pytest tests/
