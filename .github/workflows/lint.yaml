name: Lint and test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check . --output-format=github
      - name: Format
        run: ruff format --check .

  mypy:
    name: Mypy (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt mypy
      - name: Type check
        run: mypy

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover needs the base branch to diff against.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      # Every line and every branch of the integration is covered. The report
      # is printed per module, so a gap is easy to find.
      - name: Run tests
        run: |
          python -m pytest tests/ \
            --cov=custom_components.storzandbickel_ble \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100
      # Lists exactly which changed lines a pull request leaves uncovered.
      # On a push to master there is no diff, so this passes trivially.
      - name: Report coverage of changed lines
        env:
          # Passed through the environment, never interpolated into the script.
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=100
